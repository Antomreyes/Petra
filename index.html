<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petra · Tienda de Cueros</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>PETRA</h1>
    <p>Tienda de Cueros · Accesorios Artesanales</p>
  </header>

  <nav>
    <button class="active" onclick="filtrar('todos', this)">Todos</button>
    <button onclick="filtrar('carteras', this)">Carteras</button>
    <button onclick="filtrar('billeteras', this)">Billeteras</button>
    <button onclick="filtrar('zapatos', this)">Zapatos</button>
    <button onclick="filtrar('neceser', this)">Neceser</button>
    <button onclick="filtrar('accesorios', this)">Accesorios</button>
  </nav>

  <main id="grid"></main>

  <div id="modal" onclick="cerrarModal()">
    <div id="modal-contenido" onclick="event.stopPropagation()">
      <button id="modal-cerrar" onclick="cerrarModal()">✕</button>
      <div id="modal-fotos"></div>
      <h2 id="modal-nombre"></h2>
      <p id="modal-desc"></p>
      <p id="modal-precio"></p>
      <div id="modal-botones">
        <a id="btn-wa" href="#" target="_blank">💬 WhatsApp</a>
        <a id="btn-ig" href="https://instagram.com/petra_cueros" target="_blank">📷 Instagram</a>
      </div>
    </div>
  </div>

  <footer>
    <p>PETRA · Tienda de Cueros · @petra_cueros</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
